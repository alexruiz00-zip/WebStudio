<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STORE · DANIEL CAESAR</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  
  <link href="https://fonts.googleapis.com/css2?family=Parastoo&display=swap" rel="stylesheet">

  <style>
    /* 1. ESTILO GLOBAL */
    body, h1, h2, h3, h4, h5, h6, p, a, small, .text-muted {
      color: #2D2D2D !important;
      font-family: 'Parastoo', serif;
    }

    body {
      background-color: #FFFCF3;
      margin: 0;
      overflow-x: hidden;
    }

    /* 2. NAVBAR (Estructura idéntica a Index) */
    .navbar-hero {
      position: relative; 
      padding: 24px 6vw; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
    }

    .navbar-hero .logo {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .navbar-hero nav {
      display: flex;
      gap: 4px; /* Gap base pequeño, el espacio real viene del padding de los links */
    }

    .navbar-hero nav a {
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 6px 12px;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }
    
    .navbar-hero nav a:hover {
      opacity: 0.7;
    }

    /* 3. LAYOUT DE LA TIENDA */
    .store-section {
      padding: 40px 6vw;
      min-height: 70vh;
    }

    .store-eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8B1919;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .store-eyebrow::before {
      content: '';
      display: block;
      width: 32px;
      height: 1px;
      background: #8B1919;
    }

    .store-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.05em;
      margin-bottom: 50px;
    }

    .store-title span {
      background: #8B1919;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Estilo para las tarjetas de productos de tienda.js */
    #gridProductos .card {
      background-color: transparent !important;
      border: 1px solid rgba(45, 45, 45, 0.1) !important;
      border-radius: 0 !important;
    }

    #gridProductos .btn {
      background: #8B1919 !important;
      color: #fff !important;
      border-radius: 999px !important;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 12px;
    }

    footer {
      padding: 40px 6vw;
      border-top: 1px solid rgba(45, 45, 45, 0.1);
      margin-top: 60px;
    }
  </style>
</head>
<body>

  <div class="navbar-hero">
    <a href="index.html" class="logo">DANIEL CAESAR</a>
    <nav>
      <a href="index.html">HOME</a>
      <a href="about.html">ABOUT</a>
      <a href="store.html" style="text-decoration: underline;">STORE</a>
      <a href="contact.html">CONTACT</a>
      <a href="auth.html">LOG IN</a>
      <a href="admin.html">ADMIN</a>
      <a href="carrito.html">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </svg>
        CART
      </a>
    </nav>
  </div>

  <main class="store-section">
    <div class="container-fluid p-0">
      
      <p class="store-eyebrow">COLLECTION</p>
      <h1 class="store-title">
        THE MERCH<br>
        <span>SHOP NOW</span>
      </h1>

      <div id="status" class="mb-4"></div>
      <div id="gridProductos" class="row g-4"></div>

    </div>
  </main>

  <footer class="text-center">
    <small style="letter-spacing: 0.2em; opacity: 0.6;">© 2026 · DANIEL CAESAR</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/tienda.js"></script>

</body>
</html>
