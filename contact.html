<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CONTACT · DANIEL CAESAR</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Parastoo&display=swap" rel="stylesheet">

  <style>
    body, h1, h2, h3, h4, h5, h6, p, a, small, .text-muted, input, select, textarea, button {
      color: #2D2D2D !important;
      font-family: 'Parastoo', serif;
    }

    body {
      background-color: #FFFCF3;
      margin: 0;
      overflow-x: hidden;
    }

    /* NAVBAR */

    .navbar-hero {
      position: relative;
      padding: 24px 6vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
    }

    .navbar-hero .logo {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .navbar-hero nav {
      display: flex;
      gap: 4px;
    }

    .navbar-hero nav a {
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 6px 12px;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }

    .navbar-hero nav a:hover {
      opacity: 0.7;
    }

    /* CONTACT LAYOUT */

    .contact-wrapper {
      padding: 0 6vw;
      min-height: 80vh;
      display: flex;
      align-items: center;
    }

    .text-side {
      padding-right: 4vw;
    }

    .hero-eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8B1919;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hero-eyebrow::before {
      content: '';
      display: block;
      width: 32px;
      height: 1px;
      background: #8B1919;
    }

    .hero-title {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 30px;
    }

    .hero-title span {
      background: #8B1919;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* FORM */

    .custom-input {
      background-color: transparent !important;
      border: none !important;
      border-bottom: 1px solid rgba(45, 45, 45, 0.3) !important;
      border-radius: 0 !important;
      padding: 12px 0 !important;
      font-size: 1.1rem !important;
      box-shadow: none !important;
      transition: border-color 0.3s;
    }

    .custom-input:focus {
      border-bottom: 1px solid #8B1919 !important;
    }

    .custom-input::placeholder {
      color: rgba(45, 45, 45, 0.4) !important;
    }

    select.custom-input {
      color: rgba(45, 45, 45, 0.7) !important;
      cursor: pointer;
    }

    /* BUTTONS */

    .btn-hero-primary {
      background: #8B1919 !important;
      color: #fff !important;
      border: none !important;
      border-radius: 999px !important;
      padding: 12px 32px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-hero-primary:hover {
      background: #550707 !important;
      transform: translateY(-2px);
    }

    .btn-text-only {
      background: transparent !important;
      border: none !important;
      color: rgba(45, 45, 45, 0.6) !important;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: underline;
      transition: color 0.2s;
    }

    .btn-text-only:hover {
      color: #8B1919 !important;
    }

    /* IMAGE SIDE */

    .image-side {
      position: relative;
    }

    .carousel-inner img {
      height: 75vh;
      object-fit: cover;
      filter: grayscale(15%);
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    }

    footer {
      padding: 40px 6vw;
      border-top: 1px solid rgba(45, 45, 45, 0.1);
      margin-top: 60px;
    }

    @media (max-width: 992px) {
      .contact-wrapper {
        padding-top: 40px;
        padding-bottom: 40px;
      }

      .carousel-inner img {
        height: 50vh;
        margin-top: 40px;
      }

      .text-side {
        padding-right: 0;
      }
    }
  </style>
</head>

<body>

  <div class="navbar-hero">
    <a href="index.html" class="logo">DANIEL CAESAR</a>

    <nav>
      <a href="index.html">HOME</a>
      <a href="about.html">ABOUT</a>
      <a href="store.html">STORE</a>
      <a href="contact.html" style="text-decoration: underline;">CONTACT</a>
      <a href="auth.html">LOG IN</a>
      <a href="admin.html">ADMIN</a>
      <a href="carrito.html">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </svg>
        CART
      </a>
    </nav>
  </div>

  <main class="contact-wrapper">
    <div class="container-fluid p-0">
      <div class="row align-items-center">

        <!-- LEFT SIDE -->

        <div class="col-lg-6 text-side mb-5 mb-lg-0">

          <p class="hero-eyebrow">TRANSMISSION OPEN</p>

          <h1 class="hero-title">
            STAY<br>
            <span>CONNECTED</span>
          </h1>

          <p class="lead mb-4" style="font-size: 1.1rem; line-height: 1.6;">
            Enter the world of SON OF SPERGY. Leave a message for updates, exclusive releases, unreleased visuals, and fragments from the next chapter of Daniel Caesar.
          </p>

          <form id="contactForm" class="row g-3">

            <div class="col-md-6">
              <input
                class="form-control custom-input"
                type="text"
                name="nombre"
                placeholder="Your name"
                required
              >
            </div>

            <div class="col-md-6">
              <input
                class="form-control custom-input"
                type="email"
                name="email"
                placeholder="Email address"
                required
              >
            </div>

            <div class="col-12">
              <select
                class="form-select custom-input"
                name="diaPreferido"
                required
              >
                <option value="" disabled selected>
                  Preferred contact day
                </option>

                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
              </select>
            </div>

            <div class="col-12 mb-4">
              <textarea
                class="form-control custom-input"
                name="mensaje"
                rows="3"
                placeholder="Leave your thoughts here..."
                required
              ></textarea>
            </div>

            <div class="col-12 d-flex flex-wrap gap-4 align-items-center">

              <button
                id="submitBtn"
                class="btn btn-hero-primary"
                type="submit"
              >
                SEND MESSAGE
              </button>

              <button
                class="btn btn-text-only px-0"
                type="reset"
              >
                CLEAR FORM
              </button>

            </div>

          </form>

          <div id="status" class="mt-4 fw-bold"></div>

        </div>

        <!-- RIGHT SIDE -->

        <div class="col-lg-6 image-side">

          <div
            id="galeriaAbout"
            class="carousel slide"
            data-bs-ride="carousel"
          >

            <div class="carousel-inner shadow-sm">

              <div class="carousel-item active">
                <img
                  src="https://linkstorage.linkfire.com/medialinks/images/28fa3e0b-4dd7-41db-b01b-e0e02d4602c6/artwork-440x440.jpg"
                  class="d-block w-100"
                  alt="Daniel Caesar aesthetic 1"
                >
              </div>

            </div>

            <button
              class="carousel-control-prev"
              type="button"
              data-bs-target="#galeriaAbout"
              data-bs-slide="prev"
            >
              <span class="carousel-control-prev-icon"></span>
            </button>

            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#galeriaAbout"
              data-bs-slide="next"
            >
              <span class="carousel-control-next-icon"></span>
            </button>

          </div>

        </div>

      </div>
    </div>
  </main>

  <footer class="text-center">
    <small style="letter-spacing: 0.2em; opacity: 0.6;">
      © 2026 · SON OF SPERGY · DANIEL CAESAR
    </small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAQM04Js4yBix94z6oCOfa8sZ84WCrDTUY",
      authDomain: "webstudio-ce0dc.firebaseapp.com",
      projectId: "webstudio-ce0dc",
      storageBucket: "webstudio-ce0dc.firebasestorage.app",
      messagingSenderId: "1078506531688",
      appId: "1:1078506531688:web:7378ec65889b294a4b44dd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const form = document.getElementById("contactForm");
    const statusDiv = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      const data = {
        nombre: form.nombre.value.trim(),
        email: form.email.value.trim(),
        mensaje: form.mensaje.value.trim(),
        diaPreferido: form.diaPreferido.value.trim(),
        createdAt: serverTimestamp(),
        page: location.href
      };

      if (!data.nombre || !data.email || !data.mensaje) {

        statusDiv.innerHTML = `
          <span style="color: #8B1919;">
            Complete all required fields.
          </span>
        `;

        return;
      }

      statusDiv.innerHTML = `
        <span style="color: #2D2D2D;">
          Transmitting...
        </span>
      `;

      submitBtn.disabled = true;

      try {

        const newRef = push(ref(db, "contactos"));

        await set(newRef, data);

        statusDiv.innerHTML = `
          <span style="color: green;">
            ✓ Signal received.
          </span>
        `;

        form.reset();

      } catch (err) {

        console.error(err);

        statusDiv.innerHTML = `
          <span style="color: #8B1919;">
            Transmission failed.<br>
            Please try again.
          </span>
        `;

      } finally {

        submitBtn.disabled = false;

      }

    });

  </script>

</body>
</html>
