<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADMIN · DANIEL CAESAR</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Parastoo&display=swap" rel="stylesheet">

  <style>
    /* 1. ESTILO GLOBAL */
    body, h1, h2, h3, h4, h5, h6, p, a, small, .text-muted, button {
      color: #2D2D2D !important;
      font-family: 'Parastoo', serif;
    }

    body {
      background-color: #FFFCF3; /* Fondo crema */
      margin: 0;
      overflow-x: hidden;
    }

    /* 2. NAVBAR (Idéntica al resto del sitio) */
    .navbar-hero {
      position: relative; 
      padding: 24px 6vw; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
    }

    .navbar-hero .logo {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Etiqueta ADMIN junto al logo */
    .badge-admin {
      background-color: #8B1919 !important;
      border-radius: 0;
      font-size: 9px;
      letter-spacing: 0.1em;
      padding: 4px 6px;
    }

    .navbar-hero nav {
      display: flex;
      gap: 4px;
    }

    .navbar-hero nav a {
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 6px 12px;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }
    
    .navbar-hero nav a:hover {
      opacity: 0.7;
    }

    /* 3. LAYOUT DEL ADMIN */
    .admin-section {
      padding: 40px 6vw;
      min-height: 70vh;
    }

    .admin-eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8B1919;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-eyebrow::before {
      content: '';
      display: block;
      width: 32px;
      height: 1px;
      background: #8B1919;
    }

    .admin-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.05em;
      margin-bottom: 40px;
    }

    .admin-title span {
      background: #8B1919;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 4. TABS MINIMALISTAS */
    .nav-tabs {
      border-bottom: 1px solid rgba(45, 45, 45, 0.2);
      margin-bottom: 30px;
    }

    .nav-tabs .nav-item {
      margin-bottom: -1px;
    }

    .nav-tabs .nav-link {
      color: rgba(45, 45, 45, 0.5) !important;
      border: none !important;
      border-bottom: 2px solid transparent !important;
      background: transparent !important;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 12px 24px;
      border-radius: 0;
      transition: color 0.3s;
    }

    .nav-tabs .nav-link:hover {
      color: #2D2D2D !important;
    }

    .nav-tabs .nav-link.active {
      color: #8B1919 !important;
      border-bottom: 2px solid #8B1919 !important;
    }

    /* 5. PANELES / CAJAS */
    .admin-panel-box {
      border: 1px solid rgba(45, 45, 45, 0.1);
      padding: 2rem;
      background: transparent;
    }

    .panel-subtitle {
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8B1919 !important;
      margin-bottom: 20px;
    }

    /* 6. BOTONES */
    .btn-hero-ghost {
      background: transparent !important;
      color: #2D2D2D !important;
      border: 1px solid rgba(45, 45, 45, 0.2) !important;
      border-radius: 999px !important;
      padding: 8px 24px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: border-color 0.2s, transform 0.2s;
    }

    .btn-hero-ghost:hover {
      border-color: #2D2D2D !important;
      transform: translateY(-2px);
    }

    /* Estilos inyectados por JS para listas */
    #lista-contactos > div, #lista-ordenes > div {
      border-bottom: 1px solid rgba(45, 45, 45, 0.1);
      padding-bottom: 1rem;
      margin-bottom: 1rem;
    }

    footer {
      padding: 40px 6vw;
      border-top: 1px solid rgba(45, 45, 45, 0.1);
      margin-top: 60px;
    }
  </style>
</head>
<body>

  <div class="navbar-hero">
    <a href="index.html" class="logo">
      DANIEL CAESAR
      <span class="badge badge-admin">ADMIN</span>
    </a>
    <nav>
      <a href="index.html">HOME</a>
      <a href="about.html">ABOUT</a>
      <a href="store.html">STORE</a>
      <a href="contact.html">CONTACT</a>
      <a href="auth.html">LOG IN</a>
      <a href="admin.html" style="text-decoration: underline;">ADMIN</a>
      <a href="carrito.html">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </svg>
        CART
      </a>
    </nav>
  </div>

  <main class="admin-section">
    <div class="container-fluid p-0">

      <div id="status" class="mb-4 fw-bold"></div>

      <div id="panel-admin" style="display:none">

        <div class="d-flex flex-wrap justify-content-between align-items-end mb-4">
          <div>
            <p class="admin-eyebrow">DASHBOARD</p>
            <h1 class="admin-title">
              CONTROL<br>
              <span>PANEL</span>
            </h1>
          </div>
          
          <div class="text-start text-md-end mb-3 mb-md-0">
            <span id="nav-usuario" class="d-block mb-2" style="font-weight: 600; font-size: 13px; letter-spacing: 0.05em; opacity: 0.6;"></span>
            <button id="btn-logout" class="btn btn-hero-ghost" style="display:none">LOG OUT</button>
          </div>
        </div>

        <ul class="nav nav-tabs" id="adminTabs">
          <li class="nav-item">
            <button class="nav-link active" onclick="mostrarTab('contactos')">
              CONTACTOS
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" onclick="mostrarTab('ordenes')">
              ÓRDENES
            </button>
          </li>
        </ul>

        <section id="tab-contactos">
          <div class="admin-panel-box">
            <h3 class="panel-subtitle">Mensajes de contacto recientes</h3>
            <div id="lista-contactos">
              <p class="text-muted" style="opacity: 0.6; font-style: italic;">Cargando mensajes…</p>
            </div>
          </div>
        </section>

        <section id="tab-ordenes" style="display:none">
          <div class="admin-panel-box">
            <h3 class="panel-subtitle">Historial de Órdenes</h3>
            <div id="lista-ordenes">
              <p class="text-muted" style="opacity: 0.6; font-style: italic;">Cargando órdenes…</p>
            </div>
          </div>
        </section>

      </div>

    </div>
  </main>

  <footer class="text-center">
    <small style="letter-spacing: 0.2em; opacity: 0.6;">© 2026 · DANIEL CAESAR</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script type="module" src="js/admin.js"></script>

</body>
</html>
