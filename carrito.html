<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CART · DANIEL CAESAR</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Parastoo&display=swap" rel="stylesheet">

  <style>
    /* 1. ESTILO GLOBAL */
    body, h1, h2, h3, h4, h5, h6, p, a, small, .text-muted {
      color: #2D2D2D !important;
      font-family: 'Parastoo', serif;
    }

    body {
      background-color: #FFFCF3; /* Fondo crema */
      margin: 0;
      overflow-x: hidden;
    }

    /* 2. NAVBAR (Con icono de carrito) */
    .navbar-hero {
      position: relative; 
      padding: 24px 6vw; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
    }

    .navbar-hero .logo {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .navbar-hero nav {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .navbar-hero nav a {
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 6px 12px;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }
    
    .navbar-hero nav a:hover {
      opacity: 0.7;
    }

    .cart-link {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 3. LAYOUT DEL CARRITO */
    .cart-section {
      padding: 40px 6vw;
      min-height: 70vh;
      max-width: 800px; /* Centrado y más angosto para parecer un resumen elegante */
      margin: 0 auto;
    }

    .cart-eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8B1919;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cart-eyebrow::before {
      content: '';
      display: block;
      width: 32px;
      height: 1px;
      background: #8B1919;
    }

    .cart-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.05em;
      margin-bottom: 50px;
    }

    /* 4. ESTILOS PARA LOS PRODUCTOS (Inyectados por JS) */
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
      border-bottom: 1px solid rgba(45, 45, 45, 0.1);
    }
    
    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item-name {
      font-weight: 800;
      letter-spacing: -0.02em;
      font-size: 1.2rem;
    }

    .cart-item-price {
      font-weight: 600;
      opacity: 0.7;
    }

    footer {
      padding: 40px 6vw;
      border-top: 1px solid rgba(45, 45, 45, 0.1);
      margin-top: 60px;
    }
  </style>
</head>
<body>

  <div class="navbar-hero">
    <a href="index.html" class="logo">DANIEL CAESAR</a>
    <nav>
      <a href="index.html">HOME</a>
      <a href="about.html">ABOUT</a>
      <a href="store.html">STORE</a>
      <a href="contact.html">CONTACT</a>
      <a href="auth.html">LOG IN</a>
      <a href="admin.html">ADMIN</a>
      
      <a href="carrito.html" class="cart-link ms-2" style="text-decoration: underline;">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </svg>
        CART
      </a>
    </nav>
  </div>

  <main class="cart-section">
    <p class="cart-eyebrow">YOUR ORDER</p>
    <h1 class="cart-title">SHOPPING BAG</h1>

    <div id="cartStatus" class="mb-4" style="letter-spacing: 0.1em; text-transform: uppercase;"></div>
    
    <div style="border-top: 1px solid rgba(45, 45, 45, 0.1);" id="cartList"></div>
  </main>

  <footer class="text-center">
    <small style="letter-spacing: 0.2em; opacity: 0.6;">© 2026 · DANIEL CAESAR</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script type="module">
    import { listenUserCart } from "./js/carrito.js";

    const list = document.getElementById("cartList");
    const status = document.getElementById("cartStatus");

    listenUserCart((items) => {
      if (items.length === 0) {
        status.innerHTML = "<span style='opacity:0.5; font-weight:600; font-size:12px;'>CARRITO VACÍO O SIN SESIÓN</span>";
        list.innerHTML = "";
        return;
      }

      status.innerHTML = "<span style='font-weight:600; font-size:12px;'>PRODUCTOS: " + items.length + "</span>";

      // Usando las nuevas clases CSS minimalistas en lugar de border/p-2/mb-2
      list.innerHTML = items.map(i => `
        <div class="cart-item">
          <div class="cart-item-name">${i.nombre}</div>
          <div class="cart-item-price">$${i.precio}</div>
        </div>
      `).join("");
    });
  </script>

</body>
</html>
