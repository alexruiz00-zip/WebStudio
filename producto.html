<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRODUCTO · DANIEL CAESAR</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Parastoo&display=swap" rel="stylesheet">

  <style>
    /* 1. ESTILO GLOBAL */
    body, h1, h2, h3, h4, h5, h6, p, a, small, .text-muted, input, button {
      color: #2D2D2D !important;
      font-family: 'Parastoo', serif;
    }

    body {
      background-color: #FFFCF3; /* Fondo crema */
      margin: 0;
      overflow-x: hidden;
    }

    /* 2. NAVBAR (Idéntica al resto, con Carrito) */
    .navbar-hero {
      position: relative; 
      padding: 24px 6vw; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
    }

    .navbar-hero .logo {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .navbar-hero nav {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .navbar-hero nav a {
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 6px 12px;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }
    
    .navbar-hero nav a:hover {
      opacity: 0.7;
    }

    .cart-link {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 3. LAYOUT DE PRODUCTO */
    .product-section {
      padding: 40px 6vw;
      min-height: 70vh;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8B1919;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-eyebrow::before {
      content: '';
      display: block;
      width: 32px;
      height: 1px;
      background: #8B1919;
    }

    /* 4. ELEMENTOS INYECTADOS POR JS (Limpiar estilos Bootstrap default) */
    #productDetail .card, #reviewsList .card {
      background: transparent !important;
      border: none !important;
      border-radius: 0 !important;
    }

    /* 5. FORMULARIOS (Igual a Contacto/Login) */
    .custom-input {
      background-color: transparent !important;
      border: none !important;
      border-bottom: 1px solid rgba(45, 45, 45, 0.3) !important;
      border-radius: 0 !important;
      padding: 12px 0 !important;
      font-size: 1.1rem !important;
      box-shadow: none !important;
      transition: border-color 0.3s;
    }

    .custom-input:focus {
      border-bottom: 1px solid #8B1919 !important;
    }

    .custom-input::placeholder {
      color: rgba(45, 45, 45, 0.4) !important;
    }

    /* 6. BOTONES */
    .btn-hero-primary {
      background: #8B1919 !important;
      color: #fff !important;
      border: none !important;
      border-radius: 999px !important;
      padding: 12px 32px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-hero-primary:hover {
      background: #550707 !important;
      transform: translateY(-2px);
    }

    /* 7. MODAL DEL VISOR 3D (Estilizado para encajar) */
    .modal-content {
      background-color: #FFFCF3; /* Fondo crema para el modal */
      border-radius: 0;
      border: 1px solid rgba(45, 45, 45, 0.1);
    }

    .modal-header {
      border-bottom: 1px solid rgba(45, 45, 45, 0.1);
    }

    .modal-footer {
      border-top: 1px solid rgba(45, 45, 45, 0.1);
    }

    .modal-title {
      font-weight: 800;
      letter-spacing: 0.1em;
      font-size: 14px;
      text-transform: uppercase;
    }

    .btn-close {
      opacity: 0.5;
    }

    #visor3d-canvas-wrap {
      position: relative;
      width: 100%;
      height: 480px;
      background: #0a0a0f; /* Se mantiene oscuro para resaltar el 3D */
      border-radius: 0; /* Sin bordes redondeados */
      overflow: hidden;
    }

    #visor3d-canvas-wrap canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    #visor3d-loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: opacity 0.4s;
      z-index: 5;
    }

    #visor3d-loader.oculto {
      opacity: 0;
      pointer-events: none;
    }

    .visor3d-hint {
      margin-top: 15px;
      font-size: 11px;
      color: rgba(45, 45, 45, 0.6);
      text-align: center;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .visor3d-hint span {
      margin: 0 8px;
    }

    footer {
      padding: 40px 6vw;
      border-top: 1px solid rgba(45, 45, 45, 0.1);
      margin-top: 60px;
    }
  </style>
</head>
<body>

  <div class="navbar-hero">
    <a href="index.html" class="logo">DANIEL CAESAR</a>
    <nav>
      <a href="index.html">HOME</a>
      <a href="about.html">ABOUT</a>
      <a href="store.html" style="text-decoration: underline;">STORE</a>
      <a href="contact.html">CONTACT</a>
      <a href="auth.html">LOG IN</a>
      <a href="admin.html">ADMIN</a>
      <a href="cart.html" class="cart-link ms-2">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </svg>
        CART
      </a>
    </nav>
  </div>

  <main class="product-section">
    <div id="status" class="mb-3"></div>

    <p class="section-eyebrow">DETAILS</p>
    
    <section id="productDetail" class="mb-5"></section>

    <hr style="opacity: 0.1; margin: 40px 0;">

    <div class="row">
      <div class="col-lg-5 mb-5 mb-lg-0">
        <p class="section-eyebrow">FEEDBACK</p>
        <h3 class="h4 fw-bold mb-4" style="letter-spacing: -0.02em;">LEAVE A REVIEW</h3>

        <form id="reviewForm" class="row g-3">
          <div class="col-12">
            <input class="form-control custom-input" type="text" name="nombre" placeholder="Nombre completo" required>
          </div>

          <div class="col-12 mb-3">
            <input class="form-control custom-input" type="text" name="mensaje" placeholder="Tu reseña o comentario..." required>
          </div>

          <div class="col-12">
            <button class="btn btn-hero-primary" type="submit">Enviar review</button>
          </div>
        </form>

        <div id="reviewStatus" class="mt-3 fw-bold" style="font-size: 12px;"></div>
      </div>

      <div class="col-lg-6 offset-lg-1">
        <p class="section-eyebrow">COMMUNITY</p>
        <h3 class="h4 fw-bold mb-4" style="letter-spacing: -0.02em;">REVIEWS</h3>
        <div id="reviewsList"></div>
      </div>
    </div>
  </main>

  <footer class="text-center">
    <small style="letter-spacing: 0.2em; opacity: 0.6;">© 2026 · DANIEL CAESAR</small>
  </footer>

  <div class="modal fade" id="modal3d" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">VISTA 3D DEL PRODUCTO</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body p-0">
          <div id="visor3d-canvas-wrap">
            <div id="visor3d-loader">Cargando modelo…</div>
          </div>

          <div class="p-3">
            <p class="visor3d-hint">
              <span>🖱 Arrastrar → Rotar</span>
              <span>⚲ Rueda → Zoom</span>
              <span>↕ Click der. → Mover</span>
            </p>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-hero-primary" style="background: transparent !important; color: #2D2D2D !important; border: 1px solid rgba(45,45,45,0.2) !important;" data-bs-dismiss="modal">CERRAR</button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="js/producto.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const wrap = document.getElementById('visor3d-canvas-wrap');
    const loader3d = document.getElementById('visor3d-loader');

    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera(50, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    camera.position.set(0, 0, 5);
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    renderer.setPixelRatio(devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    wrap.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const luzPrincipal = new THREE.DirectionalLight(0xffffff, 3);
    luzPrincipal.position.set(5, 8, 5);
    scene.add(luzPrincipal);
    const luzRelleno = new THREE.DirectionalLight(0xffffff, 1);
    luzRelleno.position.set(-5, -3, -3);
    scene.add(luzRelleno);

    (function animar() {
      requestAnimationFrame(animar);
      controls.update();
      renderer.render(scene, camera);
    })();

    document.getElementById('modal3d').addEventListener('show.bs.modal', (e) => {
      const rutaModelo = "chair.gltf";

      if (rutaModelo) {
        scene.children
          .filter(obj => obj.name === 'modeloCargado')
          .forEach(obj => scene.remove(obj));

        loader3d.classList.remove('oculto');
        loader3d.textContent = 'CARGANDO MODELO…';

        new GLTFLoader().load(
          './' + rutaModelo,
          (gltf) => {
            const modelo = gltf.scene;
            modelo.name = 'modeloCargado';

            const caja   = new THREE.Box3().setFromObject(modelo);
            const centro = new THREE.Vector3();
            const tamaño = new THREE.Vector3();
            caja.getCenter(centro);
            caja.getSize(tamaño);
            modelo.position.sub(centro);
            modelo.scale.setScalar(3 / tamaño.length());

            scene.add(modelo);
            loader3d.classList.add('oculto');
          },
          null,
          (err) => {
            console.error(err);
            loader3d.textContent = 'ERROR AL CARGAR EL MODELO';
          }
        );
      }
    });

    document.getElementById('modal3d').addEventListener('shown.bs.modal', () => {
      camera.aspect = wrap.clientWidth / wrap.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    });

    window.addEventListener('resize', () => {
      camera.aspect = wrap.clientWidth / wrap.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    });
  </script>

</body>
</html>
